# coturn configuration for CMeet.
#
# Without a relay, a peer behind a symmetric NAT (most mobile carriers) cannot
# reach a peer behind another NAT, and the call fails after signaling succeeds.
# STUN alone only discovers addresses; TURN forwards the media when a direct
# path does not exist.
#
# Replace every REPLACE_ME below, then see README.md in this directory.

listening-port=3478
tls-listening-port=5349

# The public IP of this host. Behind a cloud load balancer, set external-ip to
# the public address and listening-ip to the private one.
listening-ip=0.0.0.0
external-ip=REPLACE_ME_PUBLIC_IP

realm=cdsspace.pro
server-name=cdsspace.pro

# Long-term credentials for this legacy self-hosted option. The current
# Cloudflare integration does not read this user or password. If this fallback
# is reintroduced, exchange long-term credentials server-side rather than
# placing them in a public browser environment variable.
lt-cred-mech
user=REPLACE_ME_USER:REPLACE_ME_PASSWORD

# TLS. Required for turns: on 5349, which is what gets through restrictive
# corporate firewalls that block plain UDP.
cert=/etc/coturn/certs/fullchain.pem
pkey=/etc/coturn/certs/privkey.pem

# Relay only: this server must never be usable as an open proxy into a private
# network or as a reflector for amplification attacks.
no-multicast-peers
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=::1
denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff

# A meeting relay has no reason to accept unauthenticated traffic.
no-cli
no-tcp-relay
stale-nonce=600

# Ports coturn is allowed to relay media on. Open this range in the firewall.
min-port=49152
max-port=65535

fingerprint
