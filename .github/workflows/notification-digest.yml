name: Notification digest

# glashdb has no built-in scheduler, so this GitHub Actions workflow is the
# external cron: every 10 minutes it flushes the notification email queue. Each
# event is delivered as its own detailed message, while standard email headers
# group related messages into one conversation per recipient.

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Flush notification digest
        run: |
          curl -fsS -X GET "https://cdsspace.pro/api/cron/notification-digest" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -w "\nHTTP %{http_code}\n"
